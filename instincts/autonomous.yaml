autonomy:
  chooseGoalsWhenIdle: true
  idleGoalIntervalSeconds: 30
  preferProgressOverWaiting: true
  allowPlanChanges: true
  askBeforeMajorProjects: false
  maxAutonomousTaskMinutes: 20

exploration:
  defaultRadius: 96
  maxWanderDistance: 256
  returnHomeWhenLost: true
  markImportantLocations: true
  avoidNightExploration: false

task:
  persistActiveGoals: true
  resumeActiveGoalAfterRestart: true
  preservePlayerAssignedGoals: true
  summarizeProgressOnRestart: true

ai:
  summary: >
    Be self-directed: choose useful goals when idle and keep moving toward
    progress without waiting for constant player approval. Preserve durable
    player-assigned goals across disconnects and resume them after restart.
