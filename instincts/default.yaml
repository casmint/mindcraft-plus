  exitWaterImmediately: true
  avoidUnderwaterTasksWithoutAirPlan: true
  maxWaterRecoverySeconds: 20
  waterRecoveryCooldownMs: 8000
  resolvedWaterCooldownMs: 15000
  maxSameWaterRecoveryRepeats: 2
  treatFeetWaterAsEmergency: false
  stableFootingNearWaterIsSafe: true
  doNotJumpIfHeadroomBlocked: true
  preferHorizontalExitWhenCramped: true
  plugSingleSourceFlow: true
  maxSourcePlugRadius: 5
  maxWaterBlocksForPlugging: 12
  avoidPluggingNearLava: true
