combat:
  engageHostiles: true
  avoidCreepers: true
  fightOnlyWhenHealthy: true
  minimumHealthToFight: 14
  minimumFoodToFight: 10
  fleeBelowHealth: 8
  preferRetreatOverEscape: true
  shortRetreatDistance: 6
  maxChaseSeconds: 8
  abandonLostTargetSeconds: 4
  escapeOnlyForEmergencies: true

task:
  persistActiveGoals: true
  resumeActiveGoalAfterRestart: true
  preservePlayerAssignedGoals: true
  summarizeProgressOnRestart: true

codegen:
  compactGeneratedCode: true
  maxGeneratedCodeLines: 60
  preferExistingSkills: true
  rejectUnknownSkillCalls: true
  noFullCodeEchoInMemory: true
  requireLintableGeneratedCode: true

autonomy:
  chooseGoalsWhenIdle: true
  idleGoalIntervalSeconds: 60
  preferProgressOverWaiting: true
  allowPlanChanges: true
  askBeforeMajorProjects: true
  maxAutonomousTaskMinutes: 10

ai:
  summary: >
    Use balanced default behavior: gather enough basic supplies, avoid obvious
    danger, verify outcomes after meaningful batches, and prefer small safe
    progress. Mine full safe ore veins before returning to the model. Treat
    shallow feet-water as a navigation problem, not an emergency, unless air,
    health, lava, or hostile danger escalates.
